<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <style>
    .title { font: 700 38px Arial, sans-serif; fill: #18324d; }
    .subtitle { font: 400 19px Arial, sans-serif; fill: #546b80; }
    .head { font: 700 25px Arial, sans-serif; fill: #ffffff; }
    .name { font: 700 20px Arial, sans-serif; fill: #18324d; }
    .body { font: 400 16px Arial, sans-serif; fill: #52677a; }
    .flow { font: 700 18px Arial, sans-serif; fill: #18324d; }
  </style>
  <text x="800" y="58" text-anchor="middle" class="title">Структура проекта: где искать код, данные и доказательства</text>
  <text x="800" y="91" text-anchor="middle" class="subtitle">Роли разделены по папкам; старый AppFactory используется только как архитектурный ориентир</text>

  <g>
    <rect x="55" y="135" width="710" height="535" rx="24" fill="#ffffff" stroke="#2f6f9f" stroke-width="3"/>
    <rect x="55" y="135" width="710" height="62" rx="24" fill="#234f75"/>
    <rect x="55" y="173" width="710" height="24" fill="#234f75"/>
    <text x="88" y="176" class="head">src/traceable_spec — основной код</text>

    <rect x="85" y="225" width="310" height="115" rx="16" fill="#e7f4ed" stroke="#3b8b67" stroke-width="2"/>
    <text x="105" y="258" class="name">agents/use_case</text>
    <text x="105" y="286" class="body">Use Case Agent</text>
    <text x="105" y="312" class="body">graph + prompts + critic + repair</text>

    <rect x="425" y="225" width="310" height="115" rx="16" fill="#f1ebfa" stroke="#7952a5" stroke-width="2"/>
    <text x="445" y="258" class="name">agents/activity</text>
    <text x="445" y="286" class="body">Activity Diagram Agent</text>
    <text x="445" y="312" class="body">graph + prompts + Mermaid</text>

    <rect x="85" y="370" width="310" height="115" rx="16" fill="#e9f2fb" stroke="#497ca8" stroke-width="2"/>
    <text x="105" y="403" class="name">orchestration</text>
    <text x="105" y="431" class="body">корневой граф и порядок вызовов</text>
    <text x="105" y="457" class="body">pipeline + persistence/resume</text>

    <rect x="425" y="370" width="310" height="115" rx="16" fill="#fff3df" stroke="#c58725" stroke-width="2"/>
    <text x="445" y="403" class="name">validators + traceability</text>
    <text x="445" y="431" class="body">повторяемые проверки Python</text>
    <text x="445" y="457" class="body">FR → atom → UC → step → activity</text>

    <rect x="85" y="515" width="200" height="115" rx="16" fill="#f1f4f7" stroke="#7b8c9d" stroke-width="2"/>
    <text x="105" y="548" class="name">entities.py</text>
    <text x="105" y="576" class="body">Pydantic contracts</text>
    <text x="105" y="602" class="body">вход, state, выход</text>

    <rect x="305" y="515" width="210" height="115" rx="16" fill="#f1f4f7" stroke="#7b8c9d" stroke-width="2"/>
    <text x="325" y="548" class="name">evaluation</text>
    <text x="325" y="576" class="body">метрики benchmark</text>
    <text x="325" y="602" class="body">gold + similarity</text>

    <rect x="535" y="515" width="200" height="115" rx="16" fill="#f1f4f7" stroke="#7b8c9d" stroke-width="2"/>
    <text x="555" y="548" class="name">llm + mermaid</text>
    <text x="555" y="576" class="body">провайдер API</text>
    <text x="555" y="602" class="body">рендер диаграммы</text>
  </g>

  <g>
    <rect x="805" y="135" width="740" height="535" rx="24" fill="#ffffff" stroke="#6c7d8e" stroke-width="3"/>
    <rect x="805" y="135" width="740" height="62" rx="24" fill="#44596d"/>
    <rect x="805" y="173" width="740" height="24" fill="#44596d"/>
    <text x="838" y="176" class="head">Данные, эксперименты и документы</text>

    <rect x="835" y="225" width="320" height="115" rx="16" fill="#e7f4ed" stroke="#3b8b67" stroke-width="2"/>
    <text x="855" y="258" class="name">benchmark</text>
    <text x="855" y="286" class="body">30 SpecificationReq</text>
    <text x="855" y="312" class="body">DEV20 + hidden10 + gold + experts</text>

    <rect x="1185" y="225" width="330" height="115" rx="16" fill="#fff3df" stroke="#c58725" stroke-width="2"/>
    <text x="1205" y="258" class="name">configs/providers</text>
    <text x="1205" y="286" class="body">DeepSeek и Groq/Qwen presets</text>
    <text x="1205" y="312" class="body">только примеры, без API keys</text>

    <rect x="835" y="370" width="320" height="115" rx="16" fill="#e9f2fb" stroke="#497ca8" stroke-width="2"/>
    <text x="855" y="403" class="name">scripts</text>
    <text x="855" y="431" class="body">запуск B0 / B1 / FULL</text>
    <text x="855" y="457" class="body">freeze, mutations, figures</text>

    <rect x="1185" y="370" width="330" height="115" rx="16" fill="#f1ebfa" stroke="#7952a5" stroke-width="2"/>
    <text x="1205" y="403" class="name">artifacts</text>
    <text x="1205" y="431" class="body">результаты и логи запусков</text>
    <text x="1205" y="457" class="body">PNG, Mermaid, JSON, CSV</text>

    <rect x="835" y="515" width="210" height="115" rx="16" fill="#f1f4f7" stroke="#7b8c9d" stroke-width="2"/>
    <text x="855" y="548" class="name">docs</text>
    <text x="855" y="576" class="body">архитектура</text>
    <text x="855" y="602" class="body">Obsidian и защита</text>

    <rect x="1065" y="515" width="210" height="115" rx="16" fill="#f1f4f7" stroke="#7b8c9d" stroke-width="2"/>
    <text x="1085" y="548" class="name">tests</text>
    <text x="1085" y="576" class="body">41 проверки</text>
    <text x="1085" y="602" class="body">offline, без API</text>

    <rect x="1295" y="515" width="220" height="115" rx="16" fill="#f1f4f7" stroke="#7b8c9d" stroke-width="2"/>
    <text x="1315" y="548" class="name">examples</text>
    <text x="1315" y="576" class="body">безопасный запуск</text>
    <text x="1315" y="602" class="body">и демонстрация</text>
  </g>

  <rect x="55" y="715" width="1490" height="125" rx="22" fill="#ffffff" stroke="#b7c5d1" stroke-width="2"/>
  <text x="85" y="756" class="flow">Чтение кода:</text>
  <text x="230" y="756" class="body">entities → orchestration/pipeline → agents/use_case → agents/activity → validators → evaluation</text>
  <text x="85" y="795" class="flow">Проверка результата:</text>
  <text x="290" y="795" class="body">benchmark input → scripts → artifacts → docs/research → материалы защиты</text>
  <text x="85" y="824" class="body">Compatibility-файлы в корне пакета сохраняют старые импорты, но новой логики не содержат.</text>
</svg>
