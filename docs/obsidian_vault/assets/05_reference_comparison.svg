<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="800" y="72" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Старый и текущий подход</text>
  <rect x="70" y="140" width="675" height="640" rx="28" fill="#fff4dc" stroke="#b57a1d" stroke-width="4"/>
  <text x="407" y="205" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#85570f">Старый проект</text>
  <text x="407" y="242" text-anchor="middle" font-family="Arial" font-size="20" fill="#9a691b">diagrams_generation_agents — копия 3</text>
  <g font-family="Arial"><rect x="150" y="305" width="515" height="75" rx="16" fill="#ffffff" stroke="#cfaa6c"/><text x="407" y="352" text-anchor="middle" font-size="22" fill="#17324d">готовые UC/модули → LLM (языковая модель)</text><rect x="150" y="430" width="515" height="75" rx="16" fill="#ffffff" stroke="#cfaa6c"/><text x="407" y="477" text-anchor="middle" font-size="22" fill="#17324d">прямая генерация Mermaid (кода диаграммы)</text><text x="155" y="575" font-size="21" fill="#17324d">• компонентная + UC + activity</text><text x="155" y="620" font-size="21" fill="#17324d">• нет critic (критика)</text><text x="155" y="665" font-size="21" fill="#17324d">• нет полной traceability (трассировки)</text><text x="155" y="710" font-size="21" fill="#8f2634">• обнаружен жёстко записанный API-ключ</text></g>
  <rect x="855" y="140" width="675" height="640" rx="28" fill="#e9f6ee" stroke="#278357" stroke-width="4"/>
  <text x="1192" y="205" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#17643f">Текущий проект НИР</text>
  <text x="1192" y="242" text-anchor="middle" font-family="Arial" font-size="20" fill="#278357">два проверяемых агента</text>
  <g font-family="Arial"><rect x="935" y="285" width="515" height="75" rx="16" fill="#ffffff" stroke="#7ab995"/><text x="1192" y="332" text-anchor="middle" font-size="22" fill="#17324d">SpecificationReq (требования до кода)</text><rect x="935" y="390" width="515" height="75" rx="16" fill="#ffffff" stroke="#7ab995"/><text x="1192" y="437" text-anchor="middle" font-size="22" fill="#17324d">typed models (типизированные модели)</text><rect x="935" y="495" width="515" height="75" rx="16" fill="#ffffff" stroke="#7ab995"/><text x="1192" y="542" text-anchor="middle" font-size="22" fill="#17324d">validator + critic + repair (проверка и исправление)</text><text x="940" y="635" font-size="21" fill="#17324d">• только structured UC + activity</text><text x="940" y="680" font-size="21" fill="#17324d">• Mermaid — производное отображение</text><text x="940" y="725" font-size="21" fill="#17643f">• двусторонняя трассировка и метрики</text></g>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#526b82"/></marker></defs>
  <path d="M407 380 L407 420" stroke="#526b82" stroke-width="5" marker-end="url(#a)"/><path d="M1192 360 L1192 380" stroke="#526b82" stroke-width="5" marker-end="url(#a)"/><path d="M1192 465 L1192 485" stroke="#526b82" stroke-width="5" marker-end="url(#a)"/>
  <text x="800" y="845" text-anchor="middle" font-family="Arial" font-size="22" fill="#4c6278">Берём идеи fan-out/checkpoint (распараллеливание/контрольные точки), но не копируем старую архитектуру</text>
</svg>
