<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <linearGradient id="root" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173b68"/>
      <stop offset="1" stop-color="#265f9e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17324d" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#37536f"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#23845e"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7653a5"/>
    </marker>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#17324d}
      .subtitle{font:400 18px Inter,Arial,sans-serif;fill:#526b83}
      .boxTitle{font:700 19px Inter,Arial,sans-serif;fill:#17324d}
      .boxSub{font:400 14px Inter,Arial,sans-serif;fill:#526b83}
      .rootText{font:700 17px Inter,Arial,sans-serif;fill:white}
      .rootSub{font:400 13px Inter,Arial,sans-serif;fill:#dbeeff}
      .section{font:700 24px Inter,Arial,sans-serif;fill:#17324d}
      .small{font:400 13px Inter,Arial,sans-serif;fill:#526b83}
      .badge{font:700 12px Inter,Arial,sans-serif;fill:white}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="800" y="48" text-anchor="middle" class="title">Два агента и корневой оркестратор LangGraph</text>
  <text x="800" y="78" text-anchor="middle" class="subtitle">Фактическая структура pipeline (конвейера) и разделение LLM-проверок от детерминированных</text>

  <!-- Root pipeline -->
  <rect x="35" y="105" width="1530" height="150" rx="24" fill="#ffffff" stroke="#b7c8d8" stroke-width="2" filter="url(#shadow)"/>
  <text x="65" y="137" class="section">Root Graph (корневой граф-оркестратор)</text>

  <g>
    <rect x="65" y="163" width="180" height="62" rx="13" fill="#e8f2fc" stroke="#7ba6cf" stroke-width="2"/>
    <text x="155" y="188" text-anchor="middle" class="boxTitle">SpecificationReq</text>
    <text x="155" y="210" text-anchor="middle" class="boxSub">входные требования</text>

    <rect x="285" y="163" width="185" height="62" rx="13" fill="url(#root)"/>
    <text x="377" y="188" text-anchor="middle" class="rootText">Normalize</text>
    <text x="377" y="210" text-anchor="middle" class="rootSub">нормализация + ID</text>

    <rect x="510" y="163" width="190" height="62" rx="13" fill="#e7f7ef" stroke="#55aa83" stroke-width="2"/>
    <text x="605" y="188" text-anchor="middle" class="boxTitle">Agent 1</text>
    <text x="605" y="210" text-anchor="middle" class="boxSub">Use Case (варианты)</text>

    <rect x="740" y="163" width="205" height="62" rx="13" fill="#f1ebfa" stroke="#9a78c8" stroke-width="2"/>
    <text x="842" y="188" text-anchor="middle" class="boxTitle">Agent 2 × UC</text>
    <text x="842" y="210" text-anchor="middle" class="boxSub">Activity (активности)</text>

    <rect x="985" y="163" width="190" height="62" rx="13" fill="#fff3df" stroke="#d79a36" stroke-width="2"/>
    <text x="1080" y="188" text-anchor="middle" class="boxTitle">Trace check</text>
    <text x="1080" y="210" text-anchor="middle" class="boxSub">сквозные связи</text>

    <rect x="1215" y="163" width="145" height="62" rx="13" fill="#fff3df" stroke="#d79a36" stroke-width="2"/>
    <text x="1287" y="188" text-anchor="middle" class="boxTitle">Evaluator</text>
    <text x="1287" y="210" text-anchor="middle" class="boxSub">метрики</text>

    <rect x="1400" y="163" width="135" height="62" rx="13" fill="#e8f2fc" stroke="#7ba6cf" stroke-width="2"/>
    <text x="1467" y="188" text-anchor="middle" class="boxTitle">Result</text>
    <text x="1467" y="210" text-anchor="middle" class="boxSub">спецификация</text>

    <path d="M245 194 H278" fill="none" stroke="#37536f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M470 194 H503" fill="none" stroke="#37536f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M700 194 H733" fill="none" stroke="#37536f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M945 194 H978" fill="none" stroke="#37536f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1175 194 H1208" fill="none" stroke="#37536f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1360 194 H1393" fill="none" stroke="#37536f" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <!-- Agent 1 -->
  <rect x="35" y="290" width="750" height="600" rx="24" fill="#f9fffc" stroke="#55aa83" stroke-width="3" filter="url(#shadow)"/>
  <rect x="60" y="315" width="112" height="28" rx="14" fill="#23845e"/>
  <text x="116" y="334" text-anchor="middle" class="badge">AGENT 1</text>
  <text x="190" y="337" class="section">Use Case Agent (агент вариантов использования)</text>
  <text x="65" y="374" class="subtitle">Требования → структурированный UseCaseSet + FR→UC trace (трассировка)</text>

  <g>
    <rect x="75" y="410" width="185" height="78" rx="14" fill="#fce8ef" stroke="#c96a8c" stroke-width="2"/>
    <text x="167" y="439" text-anchor="middle" class="boxTitle">Generator (LLM)</text>
    <text x="167" y="463" text-anchor="middle" class="boxSub">предлагает UC и связи</text>

    <rect x="300" y="410" width="185" height="78" rx="14" fill="#fff3df" stroke="#d79a36" stroke-width="2"/>
    <text x="392" y="439" text-anchor="middle" class="boxTitle">Schema</text>
    <text x="392" y="463" text-anchor="middle" class="boxSub">Pydantic (форма)</text>

    <rect x="525" y="410" width="220" height="78" rx="14" fill="#fff3df" stroke="#d79a36" stroke-width="2"/>
    <text x="635" y="439" text-anchor="middle" class="boxTitle">Deterministic validator</text>
    <text x="635" y="463" text-anchor="middle" class="boxSub">ID, coverage, trace</text>

    <rect x="525" y="545" width="220" height="78" rx="14" fill="#fce8ef" stroke="#c96a8c" stroke-width="2"/>
    <text x="635" y="574" text-anchor="middle" class="boxTitle">Critic (LLM)</text>
    <text x="635" y="598" text-anchor="middle" class="boxSub">семантическая критика</text>

    <polygon points="392,530 480,584 392,638 304,584" fill="#e8f2fc" stroke="#6b98c4" stroke-width="2"/>
    <text x="392" y="578" text-anchor="middle" class="boxTitle">Router</text>
    <text x="392" y="600" text-anchor="middle" class="boxSub">решение</text>

    <rect x="75" y="545" width="185" height="78" rx="14" fill="#edf2f7" stroke="#879caf" stroke-width="2"/>
    <text x="167" y="574" text-anchor="middle" class="boxTitle">Repair (LLM)</text>
    <text x="167" y="598" text-anchor="middle" class="boxSub">исправляет ошибки</text>

    <rect x="175" y="710" width="195" height="72" rx="14" fill="#e7f7ef" stroke="#55aa83" stroke-width="2"/>
    <text x="272" y="739" text-anchor="middle" class="boxTitle">Finalize</text>
    <text x="272" y="763" text-anchor="middle" class="boxSub">принять результат</text>

    <rect x="455" y="710" width="195" height="72" rx="14" fill="#fde9e7" stroke="#cc6259" stroke-width="2"/>
    <text x="552" y="739" text-anchor="middle" class="boxTitle">Controlled failure</text>
    <text x="552" y="763" text-anchor="middle" class="boxSub">явная ошибка</text>

    <path d="M260 449 H293" fill="none" stroke="#23845e" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M485 449 H518" fill="none" stroke="#23845e" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M635 488 V538" fill="none" stroke="#23845e" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M525 584 H487" fill="none" stroke="#23845e" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M304 584 H267" fill="none" stroke="#23845e" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M167 545 V515 H392 V495" fill="none" stroke="#c96a8c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M365 638 L295 703" fill="none" stroke="#23845e" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M420 638 L530 703" fill="none" stroke="#cc6259" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="250" y="665" class="small">accept (принять)</text>
    <text x="490" y="665" class="small">лимит исчерпан</text>
  </g>

  <rect x="75" y="812" width="670" height="52" rx="12" fill="#ffffff" stroke="#c8d9d0"/>
  <text x="95" y="835" class="small">Текущий статус: UC generator/critic/repair имеют LLM-реализацию при явном подключении клиента.</text>
  <text x="95" y="854" class="small">Root по умолчанию пока использует scripted stub (заглушку), поэтому live wiring ещё требуется.</text>

  <!-- Agent 2 -->
  <rect x="815" y="290" width="750" height="600" rx="24" fill="#fcfaff" stroke="#9a78c8" stroke-width="3" filter="url(#shadow)"/>
  <rect x="840" y="315" width="112" height="28" rx="14" fill="#7653a5"/>
  <text x="896" y="334" text-anchor="middle" class="badge">AGENT 2</text>
  <text x="970" y="337" class="section">Activity Agent (агент диаграмм активности)</text>
  <text x="845" y="374" class="subtitle">Один Use Case → ActivityDiagram → Mermaid (визуальное представление)</text>

  <g>
    <rect x="855" y="410" width="185" height="78" rx="14" fill="#fce8ef" stroke="#c96a8c" stroke-width="2"/>
    <text x="947" y="439" text-anchor="middle" class="boxTitle">Generator (LLM)</text>
    <text x="947" y="463" text-anchor="middle" class="boxSub">планируется; сейчас stub</text>

    <rect x="1080" y="410" width="185" height="78" rx="14" fill="#fff3df" stroke="#d79a36" stroke-width="2"/>
    <text x="1172" y="439" text-anchor="middle" class="boxTitle">Schema</text>
    <text x="1172" y="463" text-anchor="middle" class="boxSub">Pydantic (форма)</text>

    <rect x="1305" y="410" width="220" height="78" rx="14" fill="#fff3df" stroke="#d79a36" stroke-width="2"/>
    <text x="1415" y="439" text-anchor="middle" class="boxTitle">Deterministic validator</text>
    <text x="1415" y="463" text-anchor="middle" class="boxSub">узлы, рёбра, guards, trace</text>

    <rect x="1305" y="545" width="220" height="78" rx="14" fill="#fce8ef" stroke="#c96a8c" stroke-width="2"/>
    <text x="1415" y="574" text-anchor="middle" class="boxTitle">Critic (LLM)</text>
    <text x="1415" y="598" text-anchor="middle" class="boxSub">планируется; сейчас stub</text>

    <polygon points="1172,530 1260,584 1172,638 1084,584" fill="#e8f2fc" stroke="#6b98c4" stroke-width="2"/>
    <text x="1172" y="578" text-anchor="middle" class="boxTitle">Router</text>
    <text x="1172" y="600" text-anchor="middle" class="boxSub">решение</text>

    <rect x="855" y="545" width="185" height="78" rx="14" fill="#edf2f7" stroke="#879caf" stroke-width="2"/>
    <text x="947" y="574" text-anchor="middle" class="boxTitle">Repair (LLM)</text>
    <text x="947" y="598" text-anchor="middle" class="boxSub">планируется; сейчас stub</text>

    <rect x="945" y="710" width="205" height="72" rx="14" fill="#f1ebfa" stroke="#9a78c8" stroke-width="2"/>
    <text x="1047" y="739" text-anchor="middle" class="boxTitle">Mermaid renderer</text>
    <text x="1047" y="763" text-anchor="middle" class="boxSub">детерминированный вывод</text>

    <rect x="1235" y="710" width="195" height="72" rx="14" fill="#fde9e7" stroke="#cc6259" stroke-width="2"/>
    <text x="1332" y="739" text-anchor="middle" class="boxTitle">Controlled failure</text>
    <text x="1332" y="763" text-anchor="middle" class="boxSub">явная ошибка</text>

    <path d="M1040 449 H1073" fill="none" stroke="#7653a5" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <path d="M1265 449 H1298" fill="none" stroke="#7653a5" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <path d="M1415 488 V538" fill="none" stroke="#7653a5" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <path d="M1305 584 H1267" fill="none" stroke="#7653a5" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <path d="M1084 584 H1047" fill="none" stroke="#7653a5" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <path d="M947 545 V515 H1172 V495" fill="none" stroke="#c96a8c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1145 638 L1065 703" fill="none" stroke="#7653a5" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <path d="M1200 638 L1310 703" fill="none" stroke="#cc6259" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1030" y="665" class="small">accept (принять)</text>
    <text x="1270" y="665" class="small">лимит исчерпан</text>
  </g>

  <rect x="855" y="812" width="670" height="52" rx="12" fill="#ffffff" stroke="#d9cfea"/>
  <text x="875" y="835" class="small">Текущий статус: модели, validators и Mermaid renderer реализованы и тестируются.</text>
  <text x="875" y="854" class="small">Live generator/critic/repair для Activity Diagram ещё должны быть подключены.</text>

  <!-- Legend -->
  <rect x="35" y="920" width="1530" height="55" rx="16" fill="#ffffff" stroke="#c4d1dd"/>
  <circle cx="85" cy="947" r="10" fill="#c96a8c"/><text x="103" y="953" class="small">LLM (смысл, критика, исправление)</text>
  <circle cx="430" cy="947" r="10" fill="#d79a36"/><text x="448" y="953" class="small">Deterministic (повторяемая проверка кодом)</text>
  <circle cx="845" cy="947" r="10" fill="#23845e"/><text x="863" y="953" class="small">Use Case Agent</text>
  <circle cx="1080" cy="947" r="10" fill="#7653a5"/><text x="1098" y="953" class="small">Activity Agent</text>
  <circle cx="1320" cy="947" r="10" fill="#cc6259"/><text x="1338" y="953" class="small">явный отказ, без скрытой ошибки</text>
</svg>
