<text x="64" y="713" class="body">B1 выглядит содержательно сильным, но формально отклонён: неполная трассировка и структурный дефект Activity.</text>
<text x="64" y="758" class="small">Ограничение: один проект; это сравнение судей, а не генерации DeepSeek против GPT-5.5. Среднее |расхождение| оценок = 0,044.</text>
