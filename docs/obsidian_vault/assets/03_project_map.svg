<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="800" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Карта текущего проекта</text>
  <rect x="590" y="115" width="420" height="90" rx="20" fill="#17324d"/>
  <text x="800" y="153" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#ffffff">AgentLangGraph / Agent</text>
  <text x="800" y="182" text-anchor="middle" font-family="Arial" font-size="18" fill="#dce8f2">(корень проекта НИР)</text>
  <g font-family="Arial">
    <rect x="60" y="290" width="340" height="440" rx="22" fill="#e7f1fb" stroke="#276da8" stroke-width="3"/><text x="230" y="340" text-anchor="middle" font-size="25" font-weight="700" fill="#174f7c">src/traceable_spec</text><text x="230" y="370" text-anchor="middle" font-size="18" fill="#276da8">(основной код)</text><text x="90" y="430" font-size="19" fill="#17324d">entities.py (модели)</text><text x="90" y="470" font-size="19" fill="#17324d">graph.py (оркестратор)</text><text x="90" y="510" font-size="19" fill="#17324d">use_cases_graph.py</text><text x="110" y="540" font-size="17" fill="#4c6278">(первый агент)</text><text x="90" y="585" font-size="19" fill="#17324d">activity_diagram_graph.py</text><text x="110" y="615" font-size="17" fill="#4c6278">(второй агент)</text><text x="90" y="660" font-size="19" fill="#17324d">validators / llm / mermaid</text><text x="110" y="690" font-size="17" fill="#4c6278">(проверки, модель, рендер)</text>
    <rect x="440" y="290" width="330" height="210" rx="22" fill="#e9f6ee" stroke="#278357" stroke-width="3"/><text x="605" y="340" text-anchor="middle" font-size="25" font-weight="700" fill="#17643f">benchmark</text><text x="605" y="370" text-anchor="middle" font-size="18" fill="#278357">(тестовый набор)</text><text x="475" y="425" font-size="19" fill="#17324d">cases.json (30 входов)</text><text x="475" y="462" font-size="19" fill="#17324d">manifest.json (состав)</text>
    <rect x="440" y="530" width="330" height="200" rx="22" fill="#fff4dc" stroke="#b57a1d" stroke-width="3"/><text x="605" y="580" text-anchor="middle" font-size="25" font-weight="700" fill="#85570f">tests + scripts</text><text x="605" y="610" text-anchor="middle" font-size="18" fill="#9a691b">(тесты и сценарии)</text><text x="475" y="665" font-size="19" fill="#17324d">pytest (проверки кода)</text><text x="475" y="700" font-size="19" fill="#17324d">experiment (эксперимент)</text>
    <rect x="810" y="290" width="330" height="210" rx="22" fill="#eef2f6" stroke="#657d93" stroke-width="3"/><text x="975" y="340" text-anchor="middle" font-size="25" font-weight="700" fill="#324b62">artifacts</text><text x="975" y="370" text-anchor="middle" font-size="18" fill="#526b82">(результаты запусков)</text><text x="845" y="425" font-size="19" fill="#17324d">JSON / CSV (данные)</text><text x="845" y="462" font-size="19" fill="#17324d">SVG / PNG (графики)</text>
    <rect x="810" y="530" width="330" height="200" rx="22" fill="#fbeaec" stroke="#b33b4a" stroke-width="3"/><text x="975" y="580" text-anchor="middle" font-size="25" font-weight="700" fill="#8f2634">.env</text><text x="975" y="610" text-anchor="middle" font-size="18" fill="#a53a47">(локальный секрет)</text><text x="845" y="665" font-size="19" fill="#17324d">DeepSeek key (ключ)</text><text x="845" y="700" font-size="19" fill="#17324d">не попадает в Git</text>
    <rect x="1180" y="290" width="360" height="440" rx="22" fill="#ffffff" stroke="#7b91a8" stroke-width="3"/><text x="1360" y="340" text-anchor="middle" font-size="25" font-weight="700" fill="#17324d">docs</text><text x="1360" y="370" text-anchor="middle" font-size="18" fill="#4c6278">(документация)</text><text x="1215" y="430" font-size="19" fill="#17324d">defense (защита)</text><text x="1215" y="475" font-size="19" fill="#17324d">architecture (архитектура)</text><text x="1215" y="520" font-size="19" fill="#17324d">benchmark (методика)</text><text x="1215" y="565" font-size="19" fill="#17324d">project_context</text><text x="1235" y="595" font-size="17" fill="#4c6278">(память проекта)</text><text x="1215" y="640" font-size="19" fill="#17324d">obsidian_vault</text><text x="1235" y="670" font-size="17" fill="#4c6278">(эта база знаний)</text>
