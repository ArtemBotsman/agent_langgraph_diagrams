<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="800" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Два агента и корневой оркестратор</text>
  <text x="800" y="112" text-anchor="middle" font-family="Arial" font-size="22" fill="#4c6278">Root Graph (корневой граф) управляет переходами, но не считается агентом</text>
  <rect x="70" y="220" width="285" height="420" rx="24" fill="#ffffff" stroke="#7b91a8" stroke-width="3"/>
  <text x="212" y="280" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#17324d">SpecificationReq</text>
  <text x="212" y="315" text-anchor="middle" font-family="Arial" font-size="20" fill="#4c6278">(входной запрос)</text>
  <text x="100" y="380" font-family="Arial" font-size="20" fill="#17324d">• задача</text>
  <text x="100" y="420" font-family="Arial" font-size="20" fill="#17324d">• название</text>
  <text x="100" y="460" font-family="Arial" font-size="20" fill="#17324d">• цель и описание</text>
  <text x="100" y="500" font-family="Arial" font-size="20" fill="#17324d">• функциональные</text>
  <text x="120" y="530" font-family="Arial" font-size="20" fill="#17324d">требования</text>
  <text x="100" y="570" font-family="Arial" font-size="20" fill="#17324d">• нефункциональные</text>
  <text x="120" y="600" font-family="Arial" font-size="20" fill="#17324d">требования</text>
  <rect x="445" y="170" width="360" height="520" rx="28" fill="#e7f1fb" stroke="#276da8" stroke-width="4"/>
  <text x="625" y="225" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#174f7c">Use Case Agent</text>
  <text x="625" y="260" text-anchor="middle" font-family="Arial" font-size="20" fill="#276da8">(агент вариантов использования)</text>
  <rect x="490" y="315" width="270" height="55" rx="12" fill="#ffffff" stroke="#7aa9d0"/>
  <text x="625" y="350" text-anchor="middle" font-family="Arial" font-size="20" fill="#17324d">Generator (генератор)</text>
  <rect x="490" y="390" width="270" height="55" rx="12" fill="#ffffff" stroke="#7aa9d0"/>
  <text x="625" y="425" text-anchor="middle" font-family="Arial" font-size="20" fill="#17324d">Validator (валидатор)</text>
  <rect x="490" y="465" width="270" height="55" rx="12" fill="#ffffff" stroke="#7aa9d0"/>
  <text x="625" y="500" text-anchor="middle" font-family="Arial" font-size="20" fill="#17324d">Critic (критик)</text>
  <rect x="490" y="540" width="270" height="55" rx="12" fill="#ffffff" stroke="#7aa9d0"/>
  <text x="625" y="575" text-anchor="middle" font-family="Arial" font-size="20" fill="#17324d">Repair (исправление)</text>
  <text x="625" y="645" text-anchor="middle" font-family="Arial" font-size="18" fill="#174f7c">Выход: UseCaseSet (набор сценариев)</text>
  <rect x="895" y="170" width="360" height="520" rx="28" fill="#e9f6ee" stroke="#278357" stroke-width="4"/>
  <text x="1075" y="225" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#17643f">Activity Diagram Agent</text>
  <text x="1075" y="260" text-anchor="middle" font-family="Arial" font-size="20" fill="#278357">(агент диаграмм активности)</text>
  <rect x="940" y="315" width="270" height="55" rx="12" fill="#ffffff" stroke="#7ab995"/>
  <text x="1075" y="350" text-anchor="middle" font-family="Arial" font-size="20" fill="#17324d">Generator (генератор)</text>
  <rect x="940" y="390" width="270" height="55" rx="12" fill="#ffffff" stroke="#7ab995"/>
  <text x="1075" y="425" text-anchor="middle" font-family="Arial" font-size="20" fill="#17324d">Validator (валидатор)</text>
  <rect x="940" y="465" width="270" height="55" rx="12" fill="#ffffff" stroke="#7ab995"/>
  <text x="1075" y="500" text-anchor="middle" font-family="Arial" font-size="20" fill="#17324d">Critic (критик)</text>
  <rect x="940" y="540" width="270" height="55" rx="12" fill="#ffffff" stroke="#7ab995"/>
  <text x="1075" y="575" text-anchor="middle" font-family="Arial" font-size="20" fill="#17324d">Repair (исправление)</text>
  <text x="1075" y="645" text-anchor="middle" font-family="Arial" font-size="18" fill="#17643f">Выход: ActivityDiagram (модель)</text>
  <rect x="1345" y="220" width="185" height="420" rx="24" fill="#ffffff" stroke="#7b91a8" stroke-width="3"/>
  <text x="1437" y="280" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#17324d">Результат</text>
  <text x="1370" y="360" font-family="Arial" font-size="19" fill="#17324d">• текст UC</text>
  <text x="1370" y="405" font-family="Arial" font-size="19" fill="#17324d">• Mermaid</text>
  <text x="1370" y="435" font-family="Arial" font-size="17" fill="#4c6278">(код диаграммы)</text>
  <text x="1370" y="485" font-family="Arial" font-size="19" fill="#17324d">• Trace</text>
  <text x="1370" y="515" font-family="Arial" font-size="17" fill="#4c6278">(трассировка)</text>
  <text x="1370" y="565" font-family="Arial" font-size="19" fill="#17324d">• Metrics</text>
  <text x="1370" y="595" font-family="Arial" font-size="17" fill="#4c6278">(метрики)</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#526b82"/></marker></defs>
  <path d="M355 430 L435 430" stroke="#526b82" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M805 430 L885 430" stroke="#526b82" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1255 430 L1335 430" stroke="#526b82" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="800" y="790" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Итого: 2 агента · 2 подграфа · 1 оркестратор · 6 внутренних LLM-ролей</text>
  <text x="800" y="835" text-anchor="middle" font-family="Arial" font-size="20" fill="#4c6278">Отдельного Architect Agent (агента-архитектора) нет</text>
</svg>
