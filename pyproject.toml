[tool.poetry]
name = "agent-nir"
version = "0.1.0"
description = "Traceable LangGraph pipeline for Use Cases and activity diagrams from functional requirements"
authors = ["Artem Botsman <botsman_artem@mail.ru>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "traceable_spec", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.7"
langgraph = "^0.4"
typing-extensions = "^4.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.9"
mypy = "^1.14"
pylint = "^4.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["traceable_spec"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["langgraph.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
