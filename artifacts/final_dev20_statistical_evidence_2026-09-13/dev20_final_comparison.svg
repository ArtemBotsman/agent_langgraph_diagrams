<text x="64" y="675" class="body">FULL: 60/60 E2E; B1: 2/60. Парная разница 96.7 п.п.</text>
<text x="64" y="707" class="body">95% bootstrap CI разницы: [91.7; 100.0] п.п.; exact p=5.72e-06.</text>
